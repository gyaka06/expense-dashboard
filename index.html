<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>(S)expense Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Consolas;
            background: linear-gradient(to bottom, #808080, #000000);
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #2323FF;
        }
        .card {
            background: #D3D3D3;
            padding: 15px;
            margin: 10px;
            border-radius: 10px;
            color: #2323FF;
        }
        .total-value {
            color: #FF3131;
            font-weight: bold;
        }

        h3 {
            margin-bottom: 5px;
        }
        
        canvas {
            max-width: 400px;
            margin-top: 0px;
            max-height: 400px;
        }
        select {
            border-radius: 5px;
            color: #2323FF;
            background: #D3D3D3;
        }
        button {
            color: #2323FF;
            background: #D3D3D3;
            border: none;
            border-radius: 5px;
        }
        #yearSelect {
            margin-left: 10px;
        }
    </style>
</head>
<body>

<h1>(S)expense Dashboard</h1>

<select id="yearSelect"></select>
<select id="monthSelect"></select>
<button onclick="applyFilter()">Apply</button>

<div class="card">
    <h3>Total Spent</h3>
    <p class="total-value" id="total"></p>
</div>

<div class="card">
    <h3>Spending by Budget</h3>
    <canvas id="chart"></canvas>
</div>

<script>
let expenses = [];
let budgets = [];
let chart = null;

const yearSelect = document.getElementById("yearSelect");
const monthSelect = document.getElementById("monthSelect");

for (let i = 1; i <= 12; i++) {
    let option = document.createElement("option");
    option.value = i;
    option.text = i;
    monthSelect.appendChild(option);
}
for (let y = 2025; y <= 2027; y++) {
    let option = document.createElement("option");
    option.value = y;
    option.text = y;
    yearSelect.appendChild(option);
}

const expensesUrl = "https://raw.githubusercontent.com/gyaka06/expense-dashboard/refs/heads/main/expenses.json";
const budgetsUrl = "https://raw.githubusercontent.com/gyaka06/expense-dashboard/refs/heads/main/monthlyBudgets.json";

function formatNumber(num) {
    return new Intl.NumberFormat('hu-HU').format(num);
}

Promise.all
([
    fetch(expensesUrl).then(res => res.json()),
    fetch(budgetsUrl).then(res => res.json())
])
.then(([exp, bud]) => 
{
    expenses = exp;
    budgets = bud;

    const now = new Date();

    yearSelect.value = now.getFullYear();
    monthSelect.value = now.getMonth() + 1;
    
    updateDashboard(now.getFullYear(), now.getMonth() + 1);
});

function updateDashboard(year, month) {

    let total = 0;
    let categories = {};
    let allCategories = {};
    let currentCategories = {};
    let previousCategories = {};

    let previousMonth = month - 1;
    let previousYear = year;

    if (previousMonth === 0) {
        previousMonth = 12;
        previousYear--;
    }

    expenses.forEach(e => {
        const d = new Date(e.Date);

        if (d.getFullYear() === year && d.getMonth() + 1 === month) {

            total += e.Amount;

            if (!allCategories[e.Budget]) {
                allCategories[e.Budget] = 0;
            }

            allCategories[e.Budget] += e.Amount;

            if (e.Amount > 0) {
                if (!categories[e.Budget]) {
                    categories[e.Budget] = 0;
                }

                categories[e.Budget] += e.Amount;
            }
        }
    });
    expenses.forEach(e => {

    const d = new Date(e.Date);

    // currentMonth
    if (d.getFullYear() === year &&
        d.getMonth() + 1 === month) {

        if (!currentCategories[e.Budget])
            currentCategories[e.Budget] = 0;

        currentCategories[e.Budget] += e.Amount;
    }

    // previousMonth
    if (d.getFullYear() === previousYear &&
        d.getMonth() + 1 === previousMonth) {

        if (!previousCategories[e.Budget])
            previousCategories[e.Budget] = 0;

        previousCategories[e.Budget] += e.Amount;
    }
    });

    let insights = [];

    Object.keys(currentCategories).forEach(category => {
        let current = currentCategories[category] || 0;
        let previous = previousCategories[category] || 0;

        if (previous > 0) {
            let change =
                ((current - previous) / previous) * 100;
            if (change > 0) {
                insights.push(
                    `${category}: ↑ ${change.toFixed(1)}% vs last month`
                    );
            }
            else if (change < 0) {
                insights.push(
                    `${category}: ↓ ${Math.abs(change).toFixed(1)}% vs last month`
                    );
            }
            else {
                insights.push(
                    `${category}: no change`
                    );
            }
        }
    });

    document.getElementById("total").innerText = formatNumber(total);

    const currentBudget = budgets.find(b =>
        b.Month === month && b.Year === year
    );

    if (currentBudget) {
        document.getElementById("savings").innerText =
            formatNumber(currentBudget.SavingsBudget - (allCategories["Savings"] || 0));

        document.getElementById("fun").innerText =
            formatNumber(currentBudget.FunBudget - (allCategories["Fun"] || 0));

        document.getElementById("living").innerText =
            formatNumber(currentBudget.LivingBudget - (allCategories["Living"] || 0));
    }
    else {
        document.getElementById("savings").innerText = "-";
        document.getElementById("fun").innerText = "-";
        document.getElementById("living").innerText = "-";
    }

    const ctx = document.getElementById('chart');

    if (chart) {
        chart.destroy();
    }

    chart = new Chart(ctx, {
        type: 'pie',
        data: {
            labels: Object.keys(categories),
            datasets: [{
                data: Object.values(categories)
            }]
        }
    });
    document.getElementById("insights").innerHTML =
        insights.join("<br>");
}

function applyFilter() {
    const year = parseInt(document.getElementById("yearSelect").value);
    const month = parseInt(document.getElementById("monthSelect").value);

    updateDashboard(year, month);
}
</script>

<div class="card">
    <h3>Insights</h3>
    <div id="insights"></div>
</div>

<div class="card">
    <h3>Remaining Budget</h3>
    <p>Savings: <span id="savings"></span></p>
    <p>Fun: <span id="fun"></span></p>
    <p>Living: <span id="living"></span></p>
</div>
    
</body>
</html>
